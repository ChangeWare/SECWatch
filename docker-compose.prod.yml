version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secwatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secwatch}
      POSTGRES_USER: ${POSTGRES_USER:-secwatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secwatch_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secwatch-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: secwatch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-secwatch_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: secwatch-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-secwatch_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-CHANGE_ME}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-secwatch}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    command: mongod --auth
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: secwatch-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:${API_PORT:-5181}
      # Override connection strings to use Docker service names
      ConnectionStrings__DefaultConnection: "Server=postgres;Database=${POSTGRES_DB:-secwatch};User Id=${POSTGRES_USER:-secwatch_user};Password=${POSTGRES_PASSWORD};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      MongoDb__ConnectionString: "mongodb://${MONGO_USER:-secwatch_user}:${MONGO_PASSWORD}@mongodb:27017"
      MongoDb__DatabaseName: "${MONGO_DB:-secwatch}"
      RabbitMQ__Host: "rabbitmq://rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-secwatch_user}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
    ports:
      - "${API_PORT:-5181}:${API_PORT:-5181}"
    volumes:
      - ./publish/api:/app
      - ./deploy/appsettings.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - secwatch-network

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    container_name: secwatch-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override connection strings to use Docker service names
      ConnectionStrings__DefaultConnection: "Server=postgres;Database=${POSTGRES_DB:-secwatch};User Id=${POSTGRES_USER:-secwatch_user};Password=${POSTGRES_PASSWORD};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      MongoDb__ConnectionString: "mongodb://${MONGO_USER:-secwatch_user}:${MONGO_PASSWORD}@mongodb:27017"
      MongoDb__DatabaseName: "${MONGO_DB:-secwatch}"
      RabbitMQ__Host: "rabbitmq://rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-secwatch_user}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD}"
    volumes:
      - ./publish/worker:/app
      - ./deploy/appsettings.AlertWorkerService.Production.json:/app/appsettings.Production.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - secwatch-network

  miner:
    image: python:3.11-slim
    container_name: secwatch-miner
    working_dir: /app
    environment:
      - APP_ENV=production
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-secwatch_user}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./Microservices/SECMiner:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             celery -A sec_miner.celery_app worker --loglevel=info"
    depends_on:
      - redis
      - rabbitmq
      - mongodb
    restart: unless-stopped
    networks:
      - secwatch-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongodb_data:
  miner_venv:

networks:
  secwatch-network:
    driver: bridge

